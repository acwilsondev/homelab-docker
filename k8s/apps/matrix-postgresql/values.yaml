controllers:
  main:
    annotations:
      argocd.argoproj.io/sync-options: Replace=true,Force=true
    containers:
      main:
        image:
          repository: postgres
          tag: "18"
        env:
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
        envFrom:
          - secretRef:
              name: matrix-postgres-secrets
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 512Mi

service:
  main:
    controller: main
    ports:
      postgres:
        port: 5432

persistence:
  data:
    type: persistentVolumeClaim
    # app-template v5 dropped the <release>-<key> PVC naming default that
    # v3 used for a single-item persistence block - pin the old name so
    # the existing PVC (and its data) is reused instead of orphaned.
    forceRename: matrix-postgresql-data
    accessMode: ReadWriteOnce
    size: 5Gi
    globalMounts:
      - path: /var/lib/postgresql
