controllers:
  main:
    containers:
      main:
        image:
          repository: louislam/uptime-kuma
          tag: "2"
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 512Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 3001

persistence:
  data:
    type: persistentVolumeClaim
    # app-template v5 dropped the <release>-<key> PVC naming default that
    # v3 used for a single-item persistence block - pin the old name so
    # the existing PVC (and its data) is reused instead of orphaned.
    forceRename: uptime-kuma-data
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /app/data
