controllers:
  main:
    annotations:
      argocd.argoproj.io/sync-options: Replace=true
    containers:
      main:
        image:
          repository: authelia/authelia
          tag: "4.39"
        args:
          - --config
          - /config/configuration.yml,/config/identity_providers.yml
        env:
          TZ: America/Denver
        envFrom:
          - secretRef:
              name: authelia-secrets
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 9091

persistence:
  data:
    type: persistentVolumeClaim
    # app-template v5 dropped the <release>-<key> PVC naming default that
    # v3 used for a single-item persistence block - pin the old name so
    # the existing PVC (and its data) is reused instead of orphaned.
    forceRename: authelia-data
    accessMode: ReadWriteOnce
    size: 128Mi
    globalMounts:
      - path: /config
  config:
    type: configMap
    name: authelia-config
    globalMounts:
      - path: /config/configuration.yml
        subPath: configuration.yml
        readOnly: true
  identity-providers:
    type: secret
    name: authelia-identity-providers
    globalMounts:
      - path: /config/identity_providers.yml
        subPath: identity_providers.yml
        readOnly: true
