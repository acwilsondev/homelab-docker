controllers:
  main:
    annotations:
      argocd.argoproj.io/sync-options: Replace=true,Force=true
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/calibre-web
          tag: 0.6.27-ls397
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: America/Denver
          DOCKER_MODS: linuxserver/mods:universal-calibre
          OAUTHLIB_RELAX_TOKEN_SCOPE: "1"
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 512Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 8083

persistence:
  config:
    type: persistentVolumeClaim
    # app-template v5 dropped the <release>-<key> PVC naming default that
    # v3 used for a single-item persistence block - pin the old name so
    # the existing PVC (and its data) is reused instead of orphaned.
    forceRename: calibre-web-config
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /config
  books:
    type: hostPath
    hostPath: /storage/media/books
    globalMounts:
      - path: /books
